<script>
/* ============================================================
 * 1) 归一化 + 关键词匹配（含人名豁免）
 * ============================================================ */
const CONTRACTIONS = [
  [/\bi'm\b/g,'i am'],[/\bit's\b/g,'it is'],[/\bthat's\b/g,'that is'],
  [/\bwhat's\b/g,'what is'],[/\bdon't\b/g,'do not'],[/\bcan't\b/g,'cannot'],
  [/\bwon't\b/g,'will not'],[/\blet's\b/g,'let us'],[/\bi've\b/g,'i have'],
  [/\bwho's\b/g,'who is'],[/\bhe's\b/g,'he is'],[/\bshe's\b/g,'she is'],
  [/\bthey're\b/g,'they are'],[/\bwe're\b/g,'we are'],[/\byou're\b/g,'you are'],
];
function normalize(s){
  if(!s) return '';
  let t = String(s).toLowerCase().replace(/['']/g,"'");
  for(const [re,rep] of CONTRACTIONS) t = t.replace(re,rep);
  return t.replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
const WORD_SYNONYMS = {
  mom:'mum', mommy:'mummy', granny:'grandma', nana:'grandma',
  yeah:'yes', yep:'yes', yup:'yes', ya:'yes', ok:'yes', okay:'yes',
  nope:'no', nah:'no', hi:'hello', hey:'hello',
  thanks:'thank', thankyou:'thank',
  '1':'one','2':'two','3':'three','4':'four','5':'five',
  '6':'six','7':'seven','8':'eight','9':'nine','10':'ten',
  '11':'eleven','12':'twelve','13':'thirteen','14':'fourteen','15':'fifteen',
  '16':'sixteen','17':'seventeen','18':'eighteen','19':'nineteen','20':'twenty',
};
function canonWord(w){ return WORD_SYNONYMS[w] || w; }
function canonText(s){ return normalize(s).split(' ').map(canonWord).join(' '); }

const TITLES = [
  'mum','mom','mummy','mommy','dad','daddy',
  'grandma','grandpa','granny','grandmother','grandfather',
  'brother','sister','teacher','friend','uncle','aunt',
  'miss','mr','mrs','ms','sir','madam',
];
function isNameKeyword(kw, childText){
  if(!childText) return false;
  if(TITLES.includes(kw.toLowerCase())) return false;
  const words = String(childText).split(/\s+/);
  for(let i = 1; i < words.length; i++){
    const raw = words[i].replace(/[^a-zA-Z]/g, '');
    if(raw.length < 2) continue;
    if(raw.toLowerCase() === kw.toLowerCase() && raw[0] === raw[0].toUpperCase()){
      return true;
    }
  }
  return false;
}
function matchKeywords(childSaid, keywords, childText){
  if(!keywords || !keywords.length) return { all:true, some:true, matched:0, total:0, required:0, requiredMatched:0 };
  const said = canonText(childSaid);
  let matched = 0, required = 0, requiredMatched = 0;
  for(const kw of keywords){
    const isName = isNameKeyword(kw, childText || '');
    const k = canonText(kw);
    const hit = said.includes(k);
    if(hit) matched++;
    if(!isName){
      required++;
      if(hit) requiredMatched++;
    }
  }
  return {
    all: requiredMatched === required,
    some: matched > 0,
    matched, total: keywords.length,
    required, requiredMatched,
  };
}

let correctIdx = 0;
function pickCorrect(){
  const p = FEEDBACK.correct[correctIdx % FEEDBACK.correct.length];

}

/* ============================================================
 * 4) rounds 生成
 * ============================================================ */
function buildRounds(card){
  const rounds = [];
  let r = 0;
  const scene1 = card.scenes[0];

  rounds.push({
    round: ++r, stage:'listen', scene: scene1,
    microphone: false, demoDialogue: scene1.dialogue,
  });

  for(let i=0; i<scene1.dialogue.length; i++){
    const line = scene1.dialogue[i];
    if(line.speaker !== 'Child') continue;
    const aiLine = scene1.dialogue[i-1];
    rounds.push({
      round: ++r, stage:'repeat', scene: scene1,
      microphone: true,
      aiRole: scene1.aiRole, aiEmoji: scene1.aiEmoji,
      aiText: aiLine ? aiLine.text : '',
      childRole:'You', childText: line.text,
      keywords: line.keywords || [],
    });
  }

  for(let i=0; i<scene1.dialogue.length; i++){
    const line = scene1.dialogue[i];
    if(line.speaker !== 'Child') continue;
    const aiLine = scene1.dialogue[i-1];
    rounds.push({
      round: ++r, stage:'speak', scene: scene1,
      microphone: true,
      aiRole: scene1.aiRole, aiEmoji: scene1.aiEmoji,
      aiText: aiLine ? aiLine.text : '',
      childRole:'You', childText: line.text,
      keywords: line.keywords || [],
    });
  }

  for(let s=1; s<card.scenes.length; s++){
    const scene = card.scenes[s];
    rounds.push({
      round: ++r, stage:'master-warmup', scene: scene,
      microphone: false, demoDialogue: scene.dialogue,
      sceneIndex: s+1,
    });
    for(let i=0; i<scene.dialogue.length; i++){
      const line = scene.dialogue[i];
      if(line.speaker !== 'Child') continue;
      const aiLine = scene.dialogue[i-1];
      rounds.push({
        round: ++r, stage:'master', scene: scene,
        microphone: true,
        aiRole: scene.aiRole, aiEmoji: scene.aiEmoji,
        aiText: aiLine ? aiLine.text : '',
        childRole:'You', childText: line.text,
        keywords: line.keywords || [],
      });
    }
  }
  return rounds;
}

/* ============================================================
 * 5) 进度存储
 * ============================================================ */
const PROGRESS_KEY = 'ai_english_progress_v1';
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }catch(e){}
}
function updateCardProgress(cardId, correct, total){
  const p = loadProgress();
  const ratio = total > 0 ? correct / total : 0;
  let status = 'retry';
  if(ratio >= 0.9) status = 'mastered';
  else if(ratio >= 0.7) status = 'good';
  else if(ratio >= 0.5) status = 'review';
  p[cardId] = {
    lastPlayed: new Date().toISOString(),
    correct, total, ratio, status,
    playCount: ((p[cardId] && p[cardId].playCount) || 0) + 1,
  };
  saveProgress(p);
}
function getCardStatus(cardId){
  const p = loadProgress();
  return p[cardId] || null;
}

/* ============================================================
 * 7) 语音
 * ============================================================ */
const PITCH_AI = 0.9;
const PITCH_CHILD = 1.5;
function speak(text, pitch=1.0){
  return new Promise(resolve=>{
    if(!text) return resolve();
    try{ speechSynthesis.cancel(); }catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.85; u.pitch = pitch;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x=>/en-US/i.test(x.lang) && /Google|Samantha|Aria|Zira|Ava/i.test(x.name))
           || vs.find(x=>/en/i.test(x.lang));
    if(v) u.voice = v;
    let done = false;
    const fin = ()=>{ if(!done){ done=true; resolve(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, Math.max(2500, text.length*160));
    try{ speechSynthesis.speak(u); }catch(e){ fin(); }
  });
}
function listenOnce(timeoutMs=7000){
  return new Promise(resolve=>{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return resolve({ text:'', alts:[], error:'no-asr' });
    let rec;
    try{ rec = new SR(); }catch(e){ return resolve({ text:'', alts:[], error:'init-fail' }); }
    rec.lang = 'en-US'; rec.continuous = false; rec.interimResults = false; rec.maxAlternatives = 3;
    let finished = false;
    const fin = p => { if(finished) return; finished=true; try{rec.abort()}catch(e){}; resolve(p); };
    rec.onresult = e => {
      const alts = Array.from(e.results[0]).map(r => r.transcript);
      fin({ text: alts[0] || '', alts });
    };
    rec.onerror = e => fin({ text:'', alts:[], error: e.error || 'asr-error' });
    rec.onend   = () => fin({ text:'', alts:[], error:'no-speech' });
    setTimeout(()=>fin({ text:'', alts:[], error:'timeout' }), timeoutMs);
    try{ rec.start(); }catch(e){ fin({ text:'', alts:[], error:'start-fail' }); }
  });
}
const ASR_ERRORS = ['no-asr','no-speech','not-allowed','service-not-allowed','timeout','start-fail','aborted','init-fail','asr-error'];

async function requestMicPermission(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
    return true;
  }catch(e){
    return false;
  }
}

/* ============================================================
 * 10) repeat / speak / master
 * ============================================================ */
const STAGE_MIC_CAPTION = {
  repeat: '🎤 Repeat after me',
  speak:  '🎤 Your turn',
  master: '🎤 Your turn',
};
const STAGE_LABEL = { repeat:'🔁 Repeat', speak:'💬 Speak', master:'⭐ Master' };

async function runSayRound(r){
  setStageVisual(r.stage);
  els.roleLine.textContent = `${STAGE_LABEL[r.stage] || ''}  ·  ${r.aiEmoji} ${r.aiRole}`;
  els.subtitle.textContent = r.aiText;
  els.childLine.textContent = `👧 你说：${r.childText}`;
  els.continueBtn.style.display = 'none';
  els.micRow.style.display = 'flex';
  els.micActions.style.display = 'flex';
  els.micCaption.textContent = STAGE_MIC_CAPTION[r.stage] || '';
  els.mic.textContent = '🎤';
  els.mic.disabled = true;

  setAvatarActive('ai');
  await speak(r.aiText, PITCH_AI);
  setAvatarActive(null);
  await sleep(300);

  let attempts = 0;
  while(attempts < 3){
    const res = await waitChild();
    if(res.source === 'skip'){
      state.history.push({
        round: state.roundIdx+1, stage: r.stage,
        aiText: r.aiText, childText: r.childText,
        said:'', result:'skipped', matched:'-', total:'-', source:'skip', asr_alts:'-',
      });
      break;
    }
    const said = res.text || '';
    const m = matchKeywords(said, r.keywords, r.childText);
    dbg(`${r.stage} | said="${said}" | req ${m.requiredMatched}/${m.required} | all ${m.matched}/${m.total}`);

    state.history.push({
      round: state.roundIdx+1, stage: r.stage,
      aiText: r.aiText, childText: r.childText,
      said, result: m.all ? 'correct' : (m.some ? 'partial' : 'wrong'),
      matched: m.requiredMatched, total: m.required,
      source: res.source || 'asr',
      asr_alts: (res.alts||[]).join(' | '),
    });

    if(m.all){
      setAvatarActive('ai');
      await aiSayFeedback(pickCorrect());
      setAvatarActive(null);
      break;
    } else {
      attempts++;
      setAvatarActive('ai');
      if(attempts === 1){
        await aiSayFeedback(FEEDBACK.tryAgain);
      } else if(attempts === 2){
        await aiSayFeedback(`${FEEDBACK.together} ${r.childText}`);
      } else {
        await aiSayFeedback(`${FEEDBACK.together} ${r.childText}`);
        setAvatarActive(null);
        break;
      }
      setAvatarActive(null);
    }
  }
  els.micRow.style.display = 'none';
  els.micActions.style.display = 'none';
}

async function aiSayFeedback(text){
  els.subtitle.textContent = text;
  await speak(text, PITCH_AI);
  await sleep(300);
}

/* ============================================================
 * 11) 等孩子说话（含麦克风权限恢复）
 * ============================================================ */
function waitChild(){
  els.mic.disabled = false;
  els.mic.classList.add('listening');
  els.mic.classList.remove('recording');
  els.textInputRow.classList.remove('show');
  setAvatarActive('child');

  let missCount = 0;
  let notAllowedCount = 0;
  return new Promise(async resolve=>{
    while(true){
      const res = await new Promise(r=>{
        els.mic.onclick = async () => {
          els.mic.onclick = null;
          els.mic.disabled = true;
          els.mic.classList.remove('listening');
          els.mic.classList.add('recording');
          els.subtitle.textContent = '🎤 Listening...';
          await sleep(300);
          const out = await listenOnce();
          r(out);
        };
        els.textModeBtn.onclick = () => {
          els.textInputRow.classList.add('show');
          els.textInput.focus();
        };
        const submitText = () => {
          const v = els.textInput.value.trim();
          if(!v) return;
          els.textInput.value = '';
          els.mic.onclick = null;
          r({ text:v, alts:[v], source:'text' });
        };
        els.textSubmit.onclick = submitText;
        els.textInput.onkeydown = e => { if(e.key==='Enter') submitText(); };
        els.skipBtn.onclick = () => {
          els.mic.onclick = null;
          r({ text:'', alts:[], error:'skipped', source:'skip' });
        };
      });

      if(res.source === 'text' || res.source === 'skip'){
        els.textInputRow.classList.remove('show');
        setAvatarActive(null);
        return resolve(res);
      }

      const isErr = ASR_ERRORS.includes(res.error) || !res.text || !res.text.trim();
      if(isErr){
        missCount++;
        dbg(`❌ ASR: ${res.error||'empty'} | miss ${missCount}`);

        if(res.error === 'not-allowed' || res.error === 'service-not-allowed'){
          notAllowedCount++;
          if(notAllowedCount === 1){
            dbg('⚠️ 麦克风异常，尝试自动恢复...');
            showToast('正在重新连接麦克风…', 2000);
            await requestMicPermission();
            await sleep(600);
            els.mic.disabled = false;
            els.mic.classList.add('listening');
            els.mic.classList.remove('recording');
            continue;
          } else {
            showToast('麦克风暂时不可用，请用键盘输入', 4000);
            els.textInputRow.classList.add('show');
            els.textInput.focus();
          }
        } else if(missCount >= 3){
          showToast('连续没听清，请用键盘输入', 3000);
          els.textInputRow.classList.add('show');
          els.textInput.focus();
        } else {
          showToast(`没听清，再说一次（${missCount}/3）`, 1800);
        }
        els.mic.disabled = false;
        els.mic.classList.add('listening');
        els.mic.classList.remove('recording');
        continue;
      }
      setAvatarActive(null);
      return resolve(res);
    }
  });
}

/* ============================================================
 * 12) 主流程
 * ============================================================ */
async function runAll(){
  ROUNDS = buildRounds(CARD);
  state.lastScene = null;
  for(state.roundIdx = 0; state.roundIdx < ROUNDS.length; state.roundIdx++){
    setRoundDisplay();
    const r = ROUNDS[state.roundIdx];
    if(r.scene !== state.lastScene){
      renderScene(r.scene);
      state.lastScene = r.scene;
    }
    if(r.stage === 'listen') await runListenRound(r);
    else if(r.stage === 'master-warmup') await runMasterWarmupRound(r);
    else await runSayRound(r);
  }
  await endCard();
}

function buildExportText(){
  const lines = [];
  lines.push(`=== card_${CARD.cardId} (${CARD.title}) 成绩单 ===`);
  lines.push(`日期: ${state.sessionStart.toLocaleString('zh-CN')}`);
  const correct = state.history.filter(h=>h.result==='correct').length;
  const total = state.history.filter(h=>h.result!=='skipped').length;
  lines.push(`正确: ${correct} / ${total}`);
  lines.push('');
  lines.push('round | stage | aiText | childText | said | result | reqMatched/req | source | asr_alts');
  for(const h of state.history){
    lines.push([
      h.round, h.stage, h.aiText, h.childText, h.said, h.result,
      `${h.matched}/${h.total}`, h.source||'asr',
      (h.asr_alts||'').replace(/\n/g,' ')
    ].join(' | '));
  }
  return lines.join('\n');
}

async function endCard(){
  els.stageBadge.classList.remove('show');
  els.subtitle.textContent = '';
  els.childLine.textContent = '';
  els.roleLine.textContent = '';
  const praise = pickCorrect();
  els.subtitle.textContent = `${praise} You did it!`;
  setAvatarActive('ai');
  await speak(`${praise} You did it!`, PITCH_AI);
  setAvatarActive(null);
  await sleep(500);

  const scored = state.history.filter(h=>h.result !== 'skipped');
  const correct = scored.filter(h=>h.result === 'correct').length;
  updateCardProgress(CARD.cardId, correct, scored.length);

  els.subtitle.textContent = `🎉 Card ${CARD.cardId} 完成！`;
  els.childLine.textContent = '点下方按钮查看成绩单';
  els.continueBtn.style.display = 'block';
  els.continueBtn.textContent = '📋 看成绩单';
  els.continueBtn.onclick = () => {
    els.exportText.value = buildExportText();
    els.exportModal.classList.add('show');
  };
}

/* ============================================================
 * 13) 卡片选择器
 * ============================================================ */
let currentGroup = 0;
const GROUP_SIZE = 5;

function renderCardPicker(){
  const groups = {};
  CARDS.forEach((c, idx)=>{
    const g = Math.floor(idx / GROUP_SIZE);
    if(!groups[g]) groups[g] = [];
    groups[g].push({ card:c, idx });
  });
  const groupKeys = Object.keys(groups).map(Number).sort((a,b)=>a-b);

  els.groupTabs.innerHTML = '';
  if(groupKeys.length > 1){
    groupKeys.forEach(g => {
      const start = g*GROUP_SIZE + 1;
      const end = Math.min((g+1)*GROUP_SIZE, CARDS.length);
      const btn = document.createElement('button');
      btn.className = 'group-tab' + (g === currentGroup ? ' active' : '');
      btn.textContent = `卡 ${String(start).padStart(2,'0')}–${String(end).padStart(2,'0')}`;
      btn.onclick = () => { currentGroup = g; renderCardPicker(); };
      els.groupTabs.appendChild(btn);
    });
  }

  els.cardGrid.innerHTML = '';
  const items = groups[currentGroup] || [];
  items.forEach(({card, idx})=>{
    const div = document.createElement('div');
    div.className = 'card-pick' + (idx === selectedCardIndex ? ' selected' : '');
    const status = getCardStatus(card.cardId);
    const statusIcon = status
      ? ({ mastered:'⭐', good:'✅', review:'🔄', retry:'❌' }[status.status] || '')
      : '';
    const statusCls = status ? status.status : '';
    div.innerHTML = `
      <div class="emoji">${card.scenes[0].emoji}</div>
      <div class="name">${card.title}</div>
      <div class="id">card_${card.cardId}</div>
      ${statusIcon ? `<div class="status ${statusCls}">${statusIcon}</div>` : ''}
    `;
    div.onclick = () => {
      selectedCardIndex = idx;
      CARD = CARDS[idx];
      renderCardPicker();
    };
    els.cardGrid.appendChild(div);
  });
}

/* ============================================================
 * 14) 启动
 * ============================================================ */
async function start(){
  try{
    const u = new SpeechSynthesisUtterance('.');
    u.volume = 0;
    speechSynthesis.speak(u);
  }catch(e){}

  state.roundIdx = 0;
  state.attempts = 0;
  state.history = [];
  state.lastScene = null;
  state.sessionStart = new Date();
  correctIdx = 0;

  els.overlay.style.display = 'none';
  els.micRow.style.display = 'none';
  els.micActions.style.display = 'none';
  els.continueBtn.style.display = 'none';
  els.dialogueList.style.display = 'none';
  els.dialogueList.innerHTML = '';
  els.subtitle.textContent = 'Ready?';
  els.childLine.textContent = '';
  setAvatarActive(null);

  if(speechSynthesis.getVoices().length === 0){
    await new Promise(r=>{ speechSynthesis.onvoiceschanged = r; setTimeout(r,800); });
  }

  dbg('✅ v3.5 ready');
  setStageVisual('listen');
  els.subtitle.textContent = 'Hello!';
  setAvatarActive('ai');
  await speak('Hello!', PITCH_AI);
  setAvatarActive(null);
  await runAll();
}

els.startBtn.addEventListener('click', start);
els.copyBtn.addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(els.exportText.value);
    showToast('已复制');
  }catch(e){
    els.exportText.select();
    document.execCommand('copy');
    showToast('已复制');
  }
});
els.closeExport.addEventListener('click',()=>els.exportModal.classList.remove('show'));
document.addEventListener('gesturestart', e=>e.preventDefault());

renderCardPicker();
</script>
